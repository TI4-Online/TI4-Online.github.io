<!DOCTYPE html>
<html lang="en">

<head>
  <title>Rotating</title>
  <link rel="stylesheet" href="/overlay/css/main.css" />
  <link rel="stylesheet" href="/overlay/css/resources.css" />
  <link rel="stylesheet" href="/overlay/css/technology.css" />
  <script src="/overlay/scripts/image-util.js"></script>
  <script src="/overlay/scripts/draw-player-resources.js"></script>
  <script src="/overlay/scripts/game-data-util.js"></script>
  <script src="/overlay/scripts/refresh-rotating-tf-active-player.js"></script>
  <script src="/overlay/scripts/game-data-refresh.js"></script>
</head>

<body class="no-margin">
  <div class="rotating-container">
    <!------------>
    <!-- copy 1 -->
    <!------------>
    <div class="size-tf-rotating rotating-content border" id="rotating-1">
      <table class="technology" style="width: 100%;">
        <tr>
          <th class="tech-header">PLAYER</th>
        </tr>
        <tr>
          <td class="tf-column">
            <div class="tf-abilities-content"></div>
            <div class="tf-unit-upgrades-content"></div>
            <div class="tf-genomes-content"></div>
            <div class="tf-paradigms-content"></div>
          </td>
        </tr>
      </table>
      <div class="resources player-resources-aspect-ratio-bottom" style="position: relative;">
        <canvas class="resources-canvas" width="0" height="0"></canvas>
      </div>
    </div>

    <!------------>
    <!-- copy 2 -->
    <!------------>
    <div class="size-tf-rotating rotating-content border" id="rotating-2">
      <table class="technology" style="width: 100%;">
        <tr>
          <th class="tech-header">PLAYER</th>
        </tr>
        <tr>
          <td class="tf-column">
            <div class="tf-abilities-content"></div>
            <div class="tf-unit-upgrades-content"></div>
            <div class="tf-genomes-content"></div>
            <div class="tf-paradigms-content"></div>
          </td>
        </tr>
      </table>
      <div class="resources player-resources-aspect-ratio-bottom" style="position: relative;">
        <canvas class="resources-canvas" width="0" height="0"></canvas>
      </div>
    </div>

    <!------------>
  </div>

</html>
